[package]
name = "rust-mcp-remote"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
httpdate = "1.0.3"
libc = "0.2.190"
md5 = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }
